version: 1
name: btc_5m_impulse_momentum_profiles
market: polymarket_btc_updown_5m

strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 70
  btc_move_usd_max_reference: 100
  skew_bias_note: "Prefer direction supported by market skew when momentum is already established."
  sizing_note: "Typical discretionary sizing can be up to ~50% of allocated trading balance; tune risk per user preference."
  optional_hedge_note: "When skew is extreme (for example >=95/5), allow a small opposite hedge to reduce last-second reversal risk."

shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots: ["prev", "current", "next", "next2"]
    choose: "closest_valid"
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: "skip"
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 60
    exit_before_sec: 20
    # W4 paper defaults. Re-validate on a short paper window before prod lock.
    entry_timing:
      enabled: true
      bucket_seconds: 300
      window_max_seconds_left: 240  # T-240
      window_min_seconds_left: 45   # T-45
      soft_skip_open_sec: 20
      hard_skip_last_sec: 20
      min_abs_fair_dev: 0.02
      polarized_min_abs_fair_dev: 0.25
      late_hold_ev_buffer_pp: 0.02
      late_min_ask_notional_usd: 30
      redeem_value: 1.0

profiles:
  conservative:
    description: "More stable mode: stricter filters and lower per-trade risk. Uses TWAP fair value by default."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
    twap_fair_value:
      enabled: true
      model: projected_final_twap
      min_edge_bps: 5.0
      btc_daily_vol_pct: 3.5
      hold_to_redeem: true
      description: "W3 projected-final-TWAP: P(Up) from incomplete 60s path + remaining settle window. Not spot momentum. Hold to redeem unless bid >= hold-EV."
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      daily_max_loss_usd: 50
      max_trades_per_day: 12
    hedge:
      enabled: false
      trigger_side_price_gte: 0.95
      trigger_seconds_left_lte: 45
      hedge_share_of_main_pct: 3
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 2
      note: "Hedge not implemented in current TWAP fair-value strategy."
    stop_loss:
      enabled: false
      stop_loss_pct_from_entry: 0.25
      note: "Legacy stop-loss disabled when hold_to_redeem is true. Exit based on hold-EV instead."

  aggressive:
    description: "Higher frequency and higher risk mode. Uses TWAP fair value by default."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
    twap_fair_value:
      enabled: true
      model: projected_final_twap
      min_edge_bps: 3.0
      btc_daily_vol_pct: 3.5
      hold_to_redeem: true
      description: "W3 projected-final-TWAP: P(Up) from incomplete 60s path + remaining settle window. Not spot momentum. Hold to redeem unless bid >= hold-EV."
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      daily_max_loss_usd: 50
      max_trades_per_day: 20
    hedge:
      enabled: false
      trigger_side_price_gte: 0.93
      trigger_seconds_left_lte: 50
      hedge_share_of_main_pct: 5
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 3
      note: "Hedge not implemented in current TWAP fair-value strategy."
    stop_loss:
      enabled: false
      stop_loss_pct_from_entry: 0.30
      note: "Legacy stop-loss disabled when hold_to_redeem is true. Exit based on hold-EV instead."

runner_mapping:
  script: "skills/btc-5m-live/scripts/test_btc_5m_session_exit_sl.py"
  direct_flags_now_supported:
    - "--threshold"
    - "--stake-usd"
    - "--stop-loss-pct"
    - "--exit-before-sec"
    - "--min-entry-seconds-left"
    - "--entry-timeout-min"
    - "--poll-sec"
    - "--execute"
  example_conservative_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 4 --stop-loss-pct 0.25 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"
  example_aggressive_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 6 --stop-loss-pct 0.30 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"

notes:
  - "TWAP fair-value mode (default): W3 projected-final-TWAP. P(Up) from the incomplete 60s TWAP path plus residual vol on the remaining settle window. Spot momentum is ignored."
  - "Settlement rule: Up wins iff Chainlink 60s TWAP at window end >= TWAP at window open. Pin window-open TWAP. Log source_ts, receipt_ts, decision_ts on PIN/CALC."
  - "W4 entry timing: default window T-240 to T-45 when |fair-0.5| and net edge are clear. Soft-skip first ~20s of the bucket. Hard-skip last ~15-20s unless polarized ask <= hold-EV - buffer and depth is OK."
  - "Entry: Trade when book price differs from fair by more than costs (crypto taker fee 7% * p * (1-p) + half-spread). Prefer maker when practical."
  - "Uncertainty: re-validate W3/W4 paper-window thresholds (entry window, hard-skip last seconds, hold-EV buffer, depth, min_abs_fair_dev) before prod lock."
  - "Exit: Hold to redeem (EV = fair_p * $1) unless selling at bid yields higher EV after fees. No legacy % stops on mid prices."
  - "Risk: One ticket per 5m bucket. Hard daily loss limit in dollars. Kill switch at runtime/.kill with flatten or hold action."
  - "Legacy threshold mode: Pass --legacy-threshold-mode to use old threshold/side-strength logic (for debug/comparison only)."
