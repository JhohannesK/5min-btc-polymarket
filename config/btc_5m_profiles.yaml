version: 1
name: btc_5m_impulse_momentum_profiles
market: polymarket_btc_updown_5m

strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 70
  btc_move_usd_max_reference: 100
  skew_bias_note: "Prefer direction supported by market skew when momentum is already established."
  sizing_note: "Typical discretionary sizing can be up to ~50% of allocated trading balance; tune risk per user preference."
  optional_hedge_note: "When skew is extreme (for example >=95/5), allow a small opposite hedge to reduce last-second reversal risk."

shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots: ["prev", "current", "next", "next2"]
    choose: "closest_valid"
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: "skip"
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 60
    exit_before_sec: 20

profiles:
  conservative:
    description: "More stable mode: stricter filters and lower per-trade risk. Uses TWAP fair value by default."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
    twap_fair_value:
      enabled: true
      min_edge_bps: 5.0
      btc_daily_vol_pct: 3.5
      hold_to_redeem: true
      description: "Trade the cheap side vs Chainlink TWAP fair when edge > costs. Hold to redeem unless bid >= hold-EV."
    # W1/W2/W5 paper defaults. Re-validate spread/depth thresholds on a short
    # paper window before locking prod numbers.
    winmore:
      min_edge_pp: 0.005  # 0.5c; gate is probability points, not bps-only
      taker_fee_rate: 0.07
      midband:
        enabled: true
        lower: 0.40
        upper: 0.60
        taker_policy: skip  # W1: ban takes when ask in [0.40, 0.60]
        extra_min_edge_pp: 0.02
      taker_delay:
        # W2: Polymarket ~250ms / itode-style matching delay. Add 0.5-1.0c
        # (vol-scaled around 3.5% daily vol, then clamped) to required net edge.
        # Prefer GTD/post-only over FAK/FOK snipes. Dry-run stays default.
        delay_ms: 250
        buffer_pp: 0.005  # 0.5c at 3.5% daily vol
        vol_scale: true
        vol_ref_pct: 3.5
        buffer_min_pp: 0.005  # 0.5c floor
        buffer_max_pp: 0.010  # 1.0c cap
        prefer_post_only: true
        order_type_post_only: GTD
        order_type_taker: FAK
      sizing:
        # W5: size <= depth within N ticks of touch; fractional Kelly x
        # remaining daily loss budget; no second clip if edge decayed.
        depth_ticks: 3
        tick_size: 0.01
        kelly_fraction: 0.25
        edge_decay_ratio: 0.50
        min_stake_usd: 1.0
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      daily_max_loss_usd: 50
      max_trades_per_day: 12
    hedge:
      enabled: false
      trigger_side_price_gte: 0.95
      trigger_seconds_left_lte: 45
      hedge_share_of_main_pct: 3
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 2
      note: "Hedge not implemented in current TWAP fair-value strategy."
    stop_loss:
      enabled: false
      stop_loss_pct_from_entry: 0.25
      note: "Legacy stop-loss disabled when hold_to_redeem is true. Exit based on hold-EV instead."

  aggressive:
    description: "Higher frequency and higher risk mode. Uses TWAP fair value by default."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
    twap_fair_value:
      enabled: true
      min_edge_bps: 3.0
      btc_daily_vol_pct: 3.5
      hold_to_redeem: true
      description: "Trade the cheap side vs Chainlink TWAP fair when edge > costs. Hold to redeem unless bid >= hold-EV."
    # W1/W2/W5 paper defaults. Re-validate on a short paper window before prod lock.
    winmore:
      min_edge_pp: 0.003  # 0.3c base; still plus delay buffer
      taker_fee_rate: 0.07
      midband:
        enabled: true
        lower: 0.40
        upper: 0.60
        taker_policy: raise_min_edge  # W1: allow mid-band if net edge clears extra bar
        extra_min_edge_pp: 0.02
      taker_delay:
        # W2: ~250ms delay buffer. Aggressive uses 1.0c at 3.5% vol (still clamped).
        delay_ms: 250
        buffer_pp: 0.010  # 1.0c at 3.5% daily vol
        vol_scale: true
        vol_ref_pct: 3.5
        buffer_min_pp: 0.005
        buffer_max_pp: 0.010
        prefer_post_only: true
        order_type_post_only: GTD
        order_type_taker: FAK
      sizing:
        depth_ticks: 3
        tick_size: 0.01
        kelly_fraction: 0.30
        edge_decay_ratio: 0.50
        min_stake_usd: 1.0
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      daily_max_loss_usd: 50
      max_trades_per_day: 20
    hedge:
      enabled: false
      trigger_side_price_gte: 0.93
      trigger_seconds_left_lte: 50
      hedge_share_of_main_pct: 5
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 3
      note: "Hedge not implemented in current TWAP fair-value strategy."
    stop_loss:
      enabled: false
      stop_loss_pct_from_entry: 0.30
      note: "Legacy stop-loss disabled when hold_to_redeem is true. Exit based on hold-EV instead."

runner_mapping:
  script: "skills/btc-5m-live/scripts/test_btc_5m_session_exit_sl.py"
  direct_flags_now_supported:
    - "--threshold"
    - "--stake-usd"
    - "--stop-loss-pct"
    - "--exit-before-sec"
    - "--min-entry-seconds-left"
    - "--entry-timeout-min"
    - "--poll-sec"
    - "--execute"
  example_conservative_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 4 --stop-loss-pct 0.25 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"
  example_aggressive_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 6 --stop-loss-pct 0.30 --exit-before-sec 20 --min-entry-seconds-left 60 --entry-timeout-min 60 --poll-sec 5 --execute"

notes:
  - "TWAP fair-value mode (default): Uses Chainlink BTC/USD 60s TWAP (the series Polymarket pays) to estimate fair P(Up). Trades the cheap side vs fair only when net edge (after fees + spread) > min_edge_pp (W1 fee-aware gate in probability points)."
  - "Settlement rule: Up wins iff Chainlink 60s TWAP at window end >= TWAP at window open. Strategy pins window-open TWAP and calculates fair from live TWAP path + residual vol."
  - "W1: Skip or raise min_edge when ask is in [0.40, 0.60]. fee_pp = 0.07*p*(1-p) + half_spread + depth_cost. Conservative skips mid-band takes; aggressive raises the bar."
  - "W2: ~250ms / itode-style taker delay. Add 0.5-1.0c (vol-scaled, clamped) to required edge. Prefer GTD/post-only over FAK/FOK snipes. Dry-run remains default; do not pass --execute until paper-validated."
  - "W5: Size <= depth within N ticks of the touch. Cap with fractional Kelly x remaining daily loss budget. Do not add a second clip if edge decayed after the first fill attempt."
  - "Entry: Trade when book price differs from fair by more than costs (crypto taker fee 7% * p * (1-p) + half-spread + delay buffer). Prefer maker/GTD when practical."
  - "Exit: Hold to redeem (EV = fair_p * $1) unless selling at bid yields higher EV after fees. No legacy % stops on mid prices."
  - "Risk: One ticket per 5m bucket. Hard daily loss limit in dollars. Kill switch at runtime/.kill with flatten or hold action."
  - "Uncertainty: re-validate spread/depth thresholds on a short paper window before locking prod numbers."
  - "Legacy threshold mode: Pass --legacy-threshold-mode to use old threshold/side-strength logic (for debug/comparison only)."
